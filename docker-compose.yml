version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: diffbeacon-postgres
    environment:
      POSTGRES_DB: diffbeacon_db
      POSTGRES_USER: diffbeacon
      POSTGRES_PASSWORD: diffbeacon_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffbeacon -d diffbeacon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: diffbeacon-backend
    environment:
      DEBUG: "True"
      SECRET_KEY: "docker-local-dev-secret-key"
      DATABASE_URL: "postgres://diffbeacon:diffbeacon_secret_password@db:5432/diffbeacon_db"
      LLM_PROVIDER: "mock"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./fixtures:/app/fixtures
      - snapshot_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diffbeacon-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  snapshot_storage:
