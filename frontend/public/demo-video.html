<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiffBeacon — Interactive 1080p Product Demo Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #030605;
      color: #edf7f2;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }
    
    /* Top Toolbar */
    .header-bar {
      width: 100%;
      max-width: 1280px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 8px 16px;
      background: #090f0c;
      border: 1px solid #1d2b22;
      border-radius: 12px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
    }
    .brand-beacon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #d6fa64;
      color: #07110b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 0 14px rgba(214, 250, 100, 0.4);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-record {
      background: linear-gradient(135deg, #d6fa64 0%, #8fe6a9 100%);
      color: #06110b;
      border: 1px solid #d6fa64;
      font-weight: 700;
    }
    .btn-record:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(214, 250, 100, 0.25);
    }
    .btn-record.recording {
      background: #ef4444;
      color: #ffffff;
      border-color: #f87171;
      animation: rec-blink 1s infinite;
    }
    @keyframes rec-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }
    .btn-secondary {
      background: #0d1511;
      color: #a7b7b0;
      border: 1px solid #1d2b22;
    }
    .btn-secondary:hover {
      background: #14231b;
      color: #edf7f2;
      border-color: #2e4738;
    }

    /* Video Frame Container (16:9 Aspect Ratio) */
    .video-viewport {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #060b09;
      border: 1px solid #1d2b22;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(143, 230, 169, 0.08);
    }

    canvas#demoCanvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Video Player Controls Bar */
    .player-controls {
      width: 100%;
      max-width: 1280px;
      margin-top: 12px;
      background: #090f0c;
      border: 1px solid #1d2b22;
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scrub-container {
      position: relative;
      width: 100%;
      height: 8px;
      background: #15221b;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
    }
    .scrub-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #8fe6a9, #d6fa64);
      transition: width 0.05s linear;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .left-controls, .right-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .play-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #15241b;
      border: 1px solid #2e4738;
      color: #d6fa64;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .play-btn:hover {
      background: #20362a;
      transform: scale(1.05);
    }
    .time-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #8fe6a9;
    }
    .scene-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }
    .scene-pill {
      font-size: 10px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      padding: 3px 8px;
      border-radius: 6px;
      background: #0d1511;
      border: 1px solid #1b281f;
      color: #7a8c86;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .scene-pill:hover {
      color: #edf7f2;
      border-color: #2e4738;
    }
    .scene-pill.active {
      background: #15241b;
      color: #d6fa64;
      border-color: #2e4738;
    }

    /* Subtitle Display Overlay */
    .subtitle-banner {
      width: 100%;
      max-width: 1280px;
      margin-top: 8px;
      padding: 10px 18px;
      background: #080d0a;
      border: 1px solid #1d2b22;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      color: #d6fa64;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
    }

    .linkedin-card {
      width: 100%;
      max-width: 1280px;
      margin-top: 14px;
      padding: 14px 18px;
      background: #080d0a;
      border: 1px solid #1d2b22;
      border-radius: 12px;
      font-size: 12px;
      color: #a7b7b0;
      line-height: 1.6;
    }
    .linkedin-card strong {
      color: #edf7f2;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <div class="header-bar">
    <div class="brand-title">
      <div class="brand-beacon">Δ</div>
      <span>DiffBeacon</span>
      <span style="color: #7a8c86; font-weight: 500; font-size: 12px;">/ BeaconWorks 1080p Product Demo Video</span>
      <span style="background: #13231a; color: #8fe6a9; border: 1px solid #213b2c; font-size: 10px; font-family: 'JetBrains Mono'; padding: 2px 6px; border-radius: 4px;">60 FPS</span>
    </div>
    <div class="header-actions">
      <button id="toggleAudioBtn" class="btn btn-secondary">
        <span id="audioIcon">🔊</span>
        <span id="audioLabel">Sound & Voice On</span>
      </button>
      <button id="recordBtn" class="btn btn-record">
        <span>⏺</span>
        <span id="recordLabel">Record & Export 1080p Video</span>
      </button>
      <button id="fullscreenBtn" class="btn btn-secondary">⛶ Fullscreen</button>
      <a href="/dashboard" class="btn btn-secondary">Open App →</a>
    </div>
  </div>

  <!-- 16:9 Canvas Viewport (1920x1080 Native Target) -->
  <div class="video-viewport" id="viewport">
    <canvas id="demoCanvas" width="1920" height="1080"></canvas>
    <!-- Live Recording Banner -->
    <div id="recordingBanner" style="display:none; position:absolute; top:20px; left:50%; transform:translateX(-50%); background:rgba(220, 38, 38, 0.95); color:#fff; padding:10px 24px; border-radius:30px; font-weight:700; font-size:13px; z-index:100; box-shadow:0 10px 30px rgba(0,0,0,0.6); align-items:center; gap:10px; font-family:'JetBrains Mono',monospace;">
      <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#fff; animation:rec-blink 1s infinite;"></span>
      <span id="recordingStatusText">RECORDING 1080p DEMO: 0s / 88s</span>
      <span style="font-weight:400; font-size:11px; opacity:0.9;">(Auto-downloads on finish)</span>
    </div>
  </div>

  <!-- Player Controls -->
  <div class="player-controls">
    <div class="scrub-container" id="scrubber">
      <div class="scrub-fill" id="scrubFill"></div>
    </div>
    <div class="control-row">
      <div class="left-controls">
        <button class="play-btn" id="playBtn">▶</button>
        <button class="btn btn-secondary" id="restartBtn" style="padding: 4px 8px; font-size: 11px;">↺ Restart</button>
        <div class="time-readout" id="timeDisplay">00:00 / 01:28</div>
      </div>
      <div class="scene-pills" id="scenePills">
        <button class="scene-pill active" data-time="0">1. The Question</button>
        <button class="scene-pill" data-time="10">2. BeaconWorks Workspace</button>
        <button class="scene-pill" data-time="22">3. 12-Stage AST Pipeline</button>
        <button class="scene-pill" data-time="38">4. Impact Explorer</button>
        <button class="scene-pill" data-time="58">5. Behavioral Deltas</button>
        <button class="scene-pill" data-time="72">6. Verification Sandbox</button>
        <button class="scene-pill" data-time="84">7. Closing</button>
      </div>
      <div class="right-controls">
        <button class="btn btn-secondary" id="speedBtn" style="font-family: 'JetBrains Mono'; font-size: 11px;">1.0x</button>
      </div>
    </div>
  </div>

  <!-- Subtitle Voiceover Bar -->
  <div class="subtitle-banner" id="subtitleBox">
    "A small code change can affect much more than the file you're looking at."
  </div>

  <script>
    // =========================================================================
    // DIFFBEACON 1080p DEMO VIDEO ENGINE (1920x1080 @ 60FPS)
    // Matches the exact visual identity and components of the live application!
    // =========================================================================
    const canvas = document.getElementById('demoCanvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const scrubber = document.getElementById('scrubber');
    const scrubFill = document.getElementById('scrubFill');
    const subtitleBox = document.getElementById('subtitleBox');
    const scenePills = document.querySelectorAll('.scene-pill');
    const recordBtn = document.getElementById('recordBtn');
    const recordLabel = document.getElementById('recordLabel');
    const speedBtn = document.getElementById('speedBtn');
    const toggleAudioBtn = document.getElementById('toggleAudioBtn');
    const audioIcon = document.getElementById('audioIcon');
    const audioLabel = document.getElementById('audioLabel');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    let TOTAL_DURATION = 88.0; // 88 seconds demo video
    let currentTime = 0.0;
    let isPlaying = false;
    let playbackSpeed = 1.0;
    let lastTimestamp = null;
    let soundEnabled = true;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];

    // =========================================================================
    // POLISHED AMBIENT AUDIO ENGINE (ZERO BEEPING)
    // Soft, soothing, low-pass filtered velvety warmth
    // =========================================================================
    let audioCtx = null;
    let synthMasterGain = null;
    let padOsc1 = null;
    let padOsc2 = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        synthMasterGain = audioCtx.createGain();
        synthMasterGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        synthMasterGain.connect(audioCtx.destination);

        // Lowpass filter to ensure NO high-pitch beeps or harshness
        const lowpass = audioCtx.createBiquadFilter();
        lowpass.type = 'lowpass';
        lowpass.frequency.setValueAtTime(160, audioCtx.currentTime); // Deep warm roll-off
        lowpass.connect(synthMasterGain);

        // Ambient Drone Pad (Warm F# minor root 55Hz)
        padOsc1 = audioCtx.createOscillator();
        padOsc1.type = 'sine';
        padOsc1.frequency.setValueAtTime(55.0, audioCtx.currentTime);
        padOsc1.connect(lowpass);
        padOsc1.start();

        padOsc2 = audioCtx.createOscillator();
        padOsc2.type = 'triangle';
        padOsc2.frequency.setValueAtTime(110.0, audioCtx.currentTime);
        padOsc2.connect(lowpass);
        padOsc2.start();
      } catch (e) {
        console.warn('AudioContext not supported:', e);
      }
    }

    // Ultra-soft haptic click (NOT a beep! Muted sub-bass 50Hz tap)
    function triggerHapticClick() {
      if (!audioCtx || !soundEnabled) return;
      try {
        const tap = audioCtx.createOscillator();
        const tapGain = audioCtx.createGain();
        tap.type = 'sine';
        tap.frequency.setValueAtTime(50, audioCtx.currentTime);
        tapGain.gain.setValueAtTime(0.012, audioCtx.currentTime);
        tapGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.03);
        tap.connect(tapGain);
        tapGain.connect(audioCtx.destination);
        tap.start();
        tap.stop(audioCtx.currentTime + 0.035);
      } catch (e) {}
    }

    // =========================================================================
    // NARRATION & IN-BETWEEN AUDIO TEXT SCRIPTS
    // =========================================================================
    let lastSpokenScene = -1;
    const VOICEOVER_SCRIPTS = [
      { start: 0.5, end: 9.0, text: "A small code change can affect much more than the file you're looking at." },
      { start: 10.5, end: 21.0, text: "DiffBeacon compares two versions of your code to analyze downstream impact before merging." },
      { start: 22.5, end: 36.5, text: "It runs a deterministic multi-pass AST pipeline, tracing how changes propagate across models, APIs, and services." },
      { start: 38.5, end: 56.5, text: "Instead of stopping at changed lines, DiffBeacon traces where that behavior connects across the entire architecture." },
      { start: 58.5, end: 70.5, text: "Not every conclusion has the same certainty. DiffBeacon separates what code directly supports, what is inferred, and what needs testing." },
      { start: 72.5, end: 83.0, text: "It gives your team targeted verification guidance with executable sandbox pytest cases before you merge." },
      { start: 84.5, end: 87.5, text: "DiffBeacon. Understand the impact before the merge." }
    ];

    // In-between textual annotations displayed directly inside video frames
    const IN_BETWEEN_CALLOUTS = [
      { start: 4.5, end: 9.5, title: "THE HIDDEN RIPPLE", subtitle: "A 4-line serializer change silently alters validation across 3 endpoints." },
      { start: 16.0, end: 21.5, title: "FIXTURE WORKSPACE", subtitle: "Zero cloud API keys required. 100% deterministic local AST parsing." },
      { start: 32.0, end: 37.5, title: "AST GRAPH RESOLUTION", subtitle: "1,420 Python symbols tracked across Django ORM, views, and Celery workers." },
      { start: 51.0, end: 57.5, title: "DOWNSTREAM CALL PATHWAY", subtitle: "Tracking Breaking Behavior: Corporate department validation rejected on legacy payloads." },
      { start: 65.0, end: 71.5, title: "EPISTEMIC PROVENANCE", subtitle: "Confirmed AST Proof · Inferred Framework Rules · Unverified Boundaries." },
      { start: 78.5, end: 83.5, title: "TARGETED VERIFICATION", subtitle: "Generated pytest passes in isolated ephemeral sandbox environment." }
    ];

    function speakText(text) {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      const voices = window.speechSynthesis.getVoices();
      const naturalVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('David')));
      if (naturalVoice) utterance.voice = naturalVoice;
      window.speechSynthesis.speak(utterance);
    }

    // Exact DiffBeacon Theme Palette
    const PALETTE = {
      bgCanvas: '#060b09',
      bgNavbar: '#090c09',
      bgCard: '#0c120e',
      bgElevated: '#0e1611',
      bgDarkest: '#080d0a',
      border: '#1d2b22',
      borderDivider: '#1b281f',
      borderHighlight: '#2e4738',
      accentLime: '#d6fa64',
      accentBrand: '#8fe6a9',
      accentMint: '#7ee7b2',
      accentAmber: '#f5d67b',
      accentRose: '#ff7d7d',
      textPrimary: '#edf7f2',
      textSecondary: '#a7b7b0',
      textMuted: '#677a73'
    };

    // Simulated Mouse Cursor Physics
    const mouse = {
      x: 960,
      y: 540,
      targetX: 960,
      targetY: 540,
      clicking: false,
      clickRing: 0,
      cursorType: 'arrow'
    };

    // Smooth Camera Matrix
    const camera = {
      scale: 1.0,
      targetScale: 1.0,
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0
    };

    function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
    function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

    function getSceneIndex(t) {
      if (t < 10.0) return 0; // 0..10s
      if (t < 22.0) return 1; // 10..22s
      if (t < 38.0) return 2; // 22..38s
      if (t < 58.0) return 3; // 38..58s
      if (t < 72.0) return 4; // 58..72s
      if (t < 84.0) return 5; // 72..84s
      return 6;               // 84..88s
    }

    // =========================================================================
    // TIMELINE SIMULATION UPDATE
    // =========================================================================
    function updateSimulation(t) {
      const currentVo = VOICEOVER_SCRIPTS.find(s => t >= s.start && t <= s.end);
      if (currentVo) {
        subtitleBox.textContent = `"${currentVo.text}"`;
      } else {
        subtitleBox.textContent = "DiffBeacon — Code-change intelligence with evidence and transparent uncertainty.";
      }

      const sceneIdx = getSceneIndex(t);
      if (sceneIdx !== lastSpokenScene) {
        lastSpokenScene = sceneIdx;
        scenePills.forEach((p, idx) => p.classList.toggle('active', idx === sceneIdx));
        if (currentVo) speakText(currentVo.text);
      }

      // Cursor movement trajectories matching real UI elements
      if (t < 10.0) {
        // Scene 1: Code review diff
        camera.targetScale = 1.06; camera.targetX = -40; camera.targetY = -30;
        const subT = Math.min(1, Math.max(0, (t - 2.0) / 3.0));
        mouse.targetX = lerp(450, 840, easeInOutQuad(subT));
        mouse.targetY = lerp(240, 480, easeInOutQuad(subT));
        mouse.clicking = (t > 5.5 && t < 5.8);
      } else if (t < 22.0) {
        // Scene 2: BeaconWorks Demo Workspace
        camera.targetScale = 1.0; camera.targetX = 0; camera.targetY = 0;
        if (t < 16.0) {
          const subT = Math.min(1, Math.max(0, (t - 11.0) / 2.5));
          mouse.targetX = lerp(840, 1540, easeInOutQuad(subT));
          mouse.targetY = lerp(480, 275, easeInOutQuad(subT));
          if (t > 14.5 && t < 14.8) {
            if (!mouse.clicking) triggerHapticClick();
            mouse.clicking = true;
          } else {
            mouse.clicking = false;
          }
        } else {
          mouse.targetX = 1540; mouse.targetY = 275; mouse.clicking = false;
        }
      } else if (t < 38.0) {
        // Scene 3: 12-Stage AST Pipeline
        camera.targetScale = 1.04; camera.targetX = -25; camera.targetY = -20;
        if (t < 28.0) {
          mouse.targetX = lerp(mouse.x, 820, 0.05);
          mouse.targetY = lerp(mouse.y, 440, 0.05);
        } else {
          mouse.targetX = lerp(mouse.x, 1420, 0.05);
          mouse.targetY = lerp(mouse.y, 520, 0.05);
        }
        mouse.clicking = false;
      } else if (t < 58.0) {
        // Scene 4: Analysis Workspace & Impact Explorer
        camera.targetScale = 1.10; camera.targetX = -80; camera.targetY = -60;
        if (t < 44.0) {
          // Hover & Click Node 1 (orders/serializers.py)
          const subT = Math.min(1, Math.max(0, (t - 39.0) / 2.0));
          mouse.targetX = lerp(960, 560, easeInOutQuad(subT));
          mouse.targetY = lerp(600, 520, easeInOutQuad(subT));
          if (t > 42.0 && t < 42.3) { if (!mouse.clicking) triggerHapticClick(); mouse.clicking = true; } else mouse.clicking = false;
        } else if (t < 50.0) {
          // Click Node 2 (CheckoutAPIView)
          const subT = Math.min(1, Math.max(0, (t - 45.0) / 2.0));
          mouse.targetX = lerp(560, 940, easeInOutQuad(subT));
          mouse.targetY = lerp(520, 520, easeInOutQuad(subT));
          if (t > 48.0 && t < 48.3) { if (!mouse.clicking) triggerHapticClick(); mouse.clicking = true; } else mouse.clicking = false;
        } else {
          // Click Node 3 (OrderProcessingService)
          const subT = Math.min(1, Math.max(0, (t - 51.0) / 2.0));
          mouse.targetX = lerp(940, 1320, easeInOutQuad(subT));
          mouse.targetY = lerp(520, 520, easeInOutQuad(subT));
          if (t > 54.0 && t < 54.3) { if (!mouse.clicking) triggerHapticClick(); mouse.clicking = true; } else mouse.clicking = false;
        }
      } else if (t < 72.0) {
        // Scene 5: Behavioral Deltas & Epistemic Provenance
        camera.targetScale = 1.12; camera.targetX = -110; camera.targetY = -80;
        if (t < 64.0) {
          const subT = Math.min(1, Math.max(0, (t - 59.0) / 2.0));
          mouse.targetX = lerp(1320, 680, easeInOutQuad(subT));
          mouse.targetY = lerp(520, 390, easeInOutQuad(subT));
          if (t > 62.0 && t < 62.3) { if (!mouse.clicking) triggerHapticClick(); mouse.clicking = true; } else mouse.clicking = false;
        } else {
          const subT = Math.min(1, Math.max(0, (t - 65.0) / 2.0));
          mouse.targetX = lerp(680, 1140, easeInOutQuad(subT));
          mouse.targetY = lerp(390, 390, easeInOutQuad(subT));
          if (t > 68.5 && t < 68.8) { if (!mouse.clicking) triggerHapticClick(); mouse.clicking = true; } else mouse.clicking = false;
        }
      } else if (t < 84.0) {
        // Scene 6: Verification Matrix & Sandbox
        camera.targetScale = 1.07; camera.targetX = -50; camera.targetY = -40;
        if (t < 76.0) {
          const subT = Math.min(1, Math.max(0, (t - 72.5) / 1.5));
          mouse.targetX = lerp(1140, 1600, easeInOutQuad(subT));
          mouse.targetY = lerp(390, 360, easeInOutQuad(subT));
          if (t > 74.8 && t < 75.1) { if (!mouse.clicking) triggerHapticClick(); mouse.clicking = true; } else mouse.clicking = false;
        } else {
          mouse.targetX = 1600; mouse.targetY = 360; mouse.clicking = false;

    // -------------------------------------------------------------------------

    // =========================================================================
    // RENDER HELPERS
    // =========================================================================
    function renderBrowserHeader(title) {
      ctx.fillStyle = '#080e0b'; ctx.fillRect(0, 0, 1920, 80);
      ctx.strokeStyle = PALETTE.border; ctx.beginPath(); ctx.moveTo(0, 80); ctx.lineTo(1920, 80); ctx.stroke();

      ctx.fillStyle = '#ff5f56'; ctx.beginPath(); ctx.arc(40, 40, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffbd2e'; ctx.beginPath(); ctx.arc(65, 40, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#27c93f'; ctx.beginPath(); ctx.arc(90, 40, 7, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#0c1410'; roundRect(ctx, 480, 20, 960, 40, 8, true, false);
      ctx.strokeStyle = PALETTE.border; ctx.stroke();

      ctx.fillStyle = PALETTE.textSecondary; ctx.font = '500 13px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.fillText(`🔒 https://diffbeacon-delta.vercel.app/${title}`, 960, 45);
      ctx.textAlign = 'left';
    }

    // Exact replica of frontend/src/components/Navbar.tsx
    function renderStandardAppFrame(activeNavLink = 'Workspaces') {

      renderBrowserHeader('dashboard');

      // Top Navbar (Height 70px)
      ctx.fillStyle = '#090c09'; ctx.fillRect(0, 80, 1920, 70);

      // Brand Logo Δ
      ctx.fillStyle = '#d6fa64'; roundRect(ctx, 40, 97, 34, 34, 8, true, false);
      ctx.fillStyle = '#18211c'; ctx.font = '800 18px "JetBrains Mono"';
      ctx.fillText('Δ', 50, 121);

      ctx.fillStyle = PALETTE.textPrimary; ctx.font = '700 18px "Plus Jakarta Sans"';
      ctx.fillText('DiffBeacon', 85, 120);

      ctx.fillStyle = '#7e8c7d'; ctx.font = '600 11px "JetBrains Mono"';
      ctx.fillText('BEHAVIORAL CHANGE INTELLIGENCE', 210, 119);

      // Search bar
      ctx.fillStyle = '#101410'; roundRect(ctx, 620, 97, 380, 36, 18, true, false);
      ctx.strokeStyle = '#273027'; ctx.stroke();
      ctx.fillStyle = '#858f85'; ctx.font = '500 12px "Plus Jakarta Sans"';
      ctx.fillText('🔍 Search symbols, scenarios, diffs...', 640, 120);
      ctx.fillStyle = '#444'; ctx.font = '600 10px "JetBrains Mono"';
      ctx.fillText('⌘K', 960, 120);

      // Nav Links
      const navs = ['Workspaces', 'Benchmarks', 'Languages', 'Settings'];
      navs.forEach((nav, idx) => {
        const x = 1120 + idx * 125;

          ctx.fillStyle = '#19231c'; roundRect(ctx, x - 10, 97, 110, 36, 6, true, false);
          ctx.strokeStyle = '#354638'; ctx.stroke();
        }
        ctx.fillStyle = isCurrent ? '#e8f3d0' : '#969f96';
        ctx.font = '600 13px "Plus Jakarta Sans"';
        ctx.fillText(nav, x, 120);
      });

      // User pill
      ctx.fillStyle = '#111a14'; roundRect(ctx, 1680, 97, 200, 36, 6, true, false);
      ctx.strokeStyle = '#2f3d35'; ctx.stroke();
      ctx.fillStyle = '#cfe7c9'; ctx.font = '600 12px "JetBrains Mono"';
      ctx.fillText('demo-engineer', 1700, 120);
      ctx.fillStyle = '#7a8c86'; ctx.font = '500 11px "Plus Jakarta Sans"';
      ctx.fillText('Logout', 1830, 120);
    }

    // Exact replica of the 7 tabs in AnalysisWorkspace.tsx
    function renderAnalysisWorkspaceTabs(activeTabName) {
      const tabs = [
        { label: 'Scenario Studio', badge: '3' },
        { label: 'Behavioral Deltas', badge: '3' },
        { label: 'Contract Map', badge: '3' },
        { label: 'Impact Explorer', badge: null },
        { label: 'Verification Matrix', badge: '3' },
        { label: 'Analysis Boundaries', badge: '2' },
        { label: 'Evidence & Source', badge: null }
      ];

      ctx.fillStyle = PALETTE.bgCard; roundRect(ctx, 340, 165, 1460, 60, 10, true, false);
      ctx.strokeStyle = PALETTE.border; ctx.stroke();

      tabs.forEach((tb, idx) => {
        const x = 360 + idx * 205;
        const isCurrent = tb.label === activeTabName;
        if (isCurrent) {
          ctx.fillStyle = '#15231c'; roundRect(ctx, x - 10, 175, 190, 40, 8, true, false);
          ctx.strokeStyle = '#2e4738'; ctx.stroke();
        }
        ctx.fillStyle = isCurrent ? PALETTE.accentLime : PALETTE.textSecondary;
        ctx.font = '600 12px "JetBrains Mono"';
        ctx.fillText(tb.label, x, 200);

        if (tb.badge) {
          ctx.fillStyle = isCurrent ? '#d6fa64' : '#666';
          ctx.font = '700 10px "JetBrains Mono"';

        }
      });

    // Dynamic In-Between Text Callout Overlays
    function renderInBetweenCallout(t) {
      const callout = IN_BETWEEN_CALLOUTS.find(c => t >= c.start && t <= c.end);
      if (!callout) return;

      const progress = Math.min(1, Math.min((t - callout.start) / 0.5, (callout.end - t) / 0.5));
      ctx.save();
      ctx.globalAlpha = progress;

      // Bottom floating pill overlay
      const cardW = 760, cardH = 68;
      const cardX = (1920 - cardW) / 2;
      const cardY = 960;

      ctx.fillStyle = 'rgba(6, 11, 9, 0.94)';
      roundRect(ctx, cardX, cardY, cardW, cardH, 34, true, false);
      ctx.strokeStyle = PALETTE.borderHighlight; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = PALETTE.accentLime;
      ctx.font = '700 12px "JetBrains Mono"';
      ctx.fillText(callout.title, 960, cardY + 26);

      ctx.fillStyle = PALETTE.textPrimary;
      ctx.font = '500 13px "Plus Jakarta Sans"';
      ctx.fillText(callout.subtitle, 960, cardY + 48);

      ctx.restore();
    }

    function renderMouseCursor() {
      ctx.save(); ctx.translate(mouse.x, mouse.y);
      if (mouse.clicking) {
        ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.strokeStyle = PALETTE.accentLime; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.fillStyle = '#edf7f2'; ctx.strokeStyle = '#060b09'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 18); ctx.lineTo(5, 14); ctx.lineTo(10, 22); ctx.lineTo(13, 20); ctx.lineTo(8, 12); ctx.lineTo(14, 12); ctx.closePath();
      ctx.fill(); ctx.stroke(); ctx.restore();
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath(); ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius); ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height); ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius); ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y); ctx.closePath();
      if (fill) ctx.fill(); if (stroke) ctx.stroke();
    }

    // =========================================================================
    // 60 FPS TICK ENGINE
    // =========================================================================
    function tick(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaTime = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += deltaTime * playbackSpeed;
        if (isRecording) {
          const recordingBanner = document.getElementById('recordingBanner');
          const recordingStatusText = document.getElementById('recordingStatusText');
          if (recordingBanner) recordingBanner.style.display = 'flex';
          if (recordingStatusText) {
            recordingStatusText.textContent = `RECORDING 1080p FOR LINKEDIN: ${Math.floor(currentTime)}s / ${Math.floor(TOTAL_DURATION)}s`;
          }
        }
        if (currentTime >= TOTAL_DURATION) {
          currentTime = TOTAL_DURATION; isPlaying = false; playBtn.textContent = '▶';
          if (isRecording) stopRecording();
        }
      }

      updateSimulation(currentTime);
      renderFrame(currentTime);

      const progressPercent = (currentTime / TOTAL_DURATION) * 100;
      scrubFill.style.width = `${progressPercent}%`;

      const curM = Math.floor(currentTime / 60).toString().padStart(2, '0');
      const curS = Math.floor(currentTime % 60).toString().padStart(2, '0');
      const totM = Math.floor(TOTAL_DURATION / 60).toString().padStart(2, '0');
      const totS = Math.floor(TOTAL_DURATION % 60).toString().padStart(2, '0');
      timeDisplay.textContent = `${curM}:${curS} / ${totM}:${totS}`;

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Controls
    playBtn.addEventListener('click', () => {
      initAudio();
      if (currentTime >= TOTAL_DURATION) currentTime = 0;
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '❚❚' : '▶';
    });

    restartBtn.addEventListener('click', () => {
      currentTime = 0; lastSpokenScene = -1; updateSimulation(0); renderFrame(0);
    });

    scrubber.addEventListener('click', (e) => {
      const rect = scrubber.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      currentTime = Math.max(0, Math.min(TOTAL_DURATION, pos * TOTAL_DURATION));
      lastSpokenScene = -1; updateSimulation(currentTime);
    });

    scenePills.forEach(pill => {
      pill.addEventListener('click', () => {
        initAudio();
        currentTime = parseFloat(pill.dataset.time);
        lastSpokenScene = -1; updateSimulation(currentTime);
        if (!isPlaying) { isPlaying = true; playBtn.textContent = '❚❚'; }
      });
    });

    speedBtn.addEventListener('click', () => {
      if (playbackSpeed === 1.0) playbackSpeed = 1.25;
      else if (playbackSpeed === 1.25) playbackSpeed = 1.5;
      else playbackSpeed = 1.0;
      speedBtn.textContent = `${playbackSpeed}x`;
    });

    toggleAudioBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      audioIcon.textContent = soundEnabled ? '🔊' : '🔇';
      audioLabel.textContent = soundEnabled ? 'Sound & Voice On' : 'Muted';
      if (synthMasterGain) synthMasterGain.gain.setValueAtTime(soundEnabled ? 0.03 : 0.0, audioCtx.currentTime);
      if (!soundEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    });

    fullscreenBtn.addEventListener('click', () => {
      const el = document.getElementById('viewport');
      if (!document.fullscreenElement) el.requestFullscreen().catch(err => alert(err.message));
      else document.exitFullscreen();
    });

    recordBtn.addEventListener('click', () => {
      if (!isRecording) startRecording();
      else stopRecording();
    });

    function startRecording() {
      initAudio();
      isRecording = true;
      recordedChunks = [];
      recordBtn.classList.add('recording');
      recordLabel.textContent = 'Recording 1080p... Click to Stop';
      const recordingBanner = document.getElementById('recordingBanner');
      if (recordingBanner) recordingBanner.style.display = 'flex';

      const stream = canvas.captureStream(60);
      if (audioCtx) {
        const dest = audioCtx.createMediaStreamDestination();
        synthMasterGain.connect(dest);
        const audioTracks = dest.stream.getAudioTracks();
        if (audioTracks.length > 0) stream.addTrack(audioTracks[0]);
      }

      let mimeType = 'video/webm;codecs=vp9,opus';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm;codecs=vp8,opus';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/mp4';

      try {
        mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const ext = mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });

        // Auto-save to local server if headless recording
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('autorecord') === '1') {
          fetch('/save-video', {
            method: 'POST',
            headers: { 'Content-Type': mediaRecorder.mimeType || 'video/webm' },
            body: blob
          }).then(res => res.json()).then(data => {
            console.log('VIDEO_SAVED_SUCCESSFULLY', data);
            document.title = 'RECORDING_COMPLETE';
          }).catch(err => {
            console.error('Save error:', err);
            document.title = 'RECORDING_ERROR';
          });
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `DiffBeacon-Product-Demo-1080p-${new Date().toISOString().slice(0, 10)}.${ext}`;
        a.click();
        URL.revokeObjectURL(url);
        recordBtn.classList.remove('recording');
        recordLabel.textContent = 'Record & Export 1080p Video';
        const recBanner = document.getElementById('recordingBanner');
        if (recBanner) recBanner.style.display = 'none';
        isRecording = false;
        if (urlParams.get('autorecord') !== '1') {
          alert('🎉 1080p Video export complete! The video file has been saved to your downloads folder.');
        }
      };

      currentTime = 0; lastSpokenScene = -1; isPlaying = true; playBtn.textContent = '❚❚';
      mediaRecorder.start();
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      const recBanner = document.getElementById('recordingBanner');
      if (recBanner) recBanner.style.display = 'none';
    }

    // Auto-record runner for automated exports
    const queryParams = new URLSearchParams(window.location.search);
    if (queryParams.get('autorecord') === '1') {
      const dur = queryParams.get('duration');
      if (dur) TOTAL_DURATION = parseFloat(dur);
      const spd = queryParams.get('speed');
      if (spd) playbackSpeed = parseFloat(spd);
      setTimeout(() => {
        startRecording();
      }, 300);
    }
  </script>
